# SPCS job spec for the KC release test (SNOW-4202412).
# Rendered by run_spcs_release.py (string.Template: ${IMAGE}, ${STAGE}, ${TABLE},
# ${NRECORDS}, ${TIMEOUT_SECS}) and run with EXECUTE JOB SERVICE.
#
# Finite: the container exits with the harness's return code, so the job ends
# DONE (rc 0) or FAILED (rc != 0). No credentials are supplied: auth is ambient.
spec:
  containers:
    - name: e2e
      image: ${IMAGE}
      command:
        - /bin/sh
      args:
        - /mnt/harness/run-e2e.sh
      env:
        WORK: /work
        MNT: /mnt/harness
        TABLE: ${TABLE}
        NRECORDS: "${NRECORDS}"
        TIMEOUT_SECS: "${TIMEOUT_SECS}"
      volumeMounts:
        - name: harness
          mountPath: /mnt/harness
        - name: work
          mountPath: /work
      resources:
        requests:
          memory: 3Gi
        limits:
          memory: 5Gi
  volumes:
    - name: harness
      source: stage
      stageConfig:
        name: "${STAGE}"
    - name: work
      source: local
capabilities:
  securityContext:
    # Required for this workload-identity path. The dedicated fixture tests
    # the effective network policy with and without its compute-pool rule.
    enableCustomCredentials: true
