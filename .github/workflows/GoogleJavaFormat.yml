name: GoogleJavaFormat

on:
  pull_request:
  push:
    branches:
      - master
      - release-3.5

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # google-java-format uses internal javac APIs; do not inherit the runner JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: GoogleJavaFormat
        id: googlejavaformat
        uses: axel-op/googlejavaformat-action@v3
        with:
          skip-commit: true
          version: v1.24.0
          args: "-n --set-exit-if-changed"